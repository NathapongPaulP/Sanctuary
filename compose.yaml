services:
  db:
    image: postgres:18
    container_name: sanctuary_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    ports:
      # 127.0.0.1 = only reachable from this machine, not the network
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ expects the volume at /var/lib/postgresql (not .../data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: